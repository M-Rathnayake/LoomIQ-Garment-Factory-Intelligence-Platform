# LoomIQ project configuration.
# All paths are relative to the project root.

project:
  name: LoomIQ
  random_seed: 42

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  images: data/images
  models: models
  figures: reports/figures
  reports: reports

data:
  # UCI "Productivity Prediction of Garment Employees" file name (see docs/DATASETS.md)
  productivity_file: garments_worker_productivity.csv
  cleaned_file: garments_clean.csv
  features_file: productivity_features.csv

productivity_model:
  target_column: met_target
  # The last 20% of dates are held out as a "future" test set
  test_size: 0.2
  cv_folds: 5
  # F1 for the "missed target" class: catching at-risk lines is what matters
  scoring: missed_f1
  # Incentive may be paid because of high output (see notebook 02), so it is
  # excluded by default to avoid leaking the answer into the model
  use_incentive: false
  model_file: productivity_model.joblib
  metrics_file: productivity_metrics.json
  logistic_regression:
    C: 1.0
    max_iter: 2000
  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 5
  xgboost:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

optimization:
  # Standard shift length (8 hours)
  shift_minutes: 480
  # Extra overtime per worker that may be recommended, and its step size
  max_overtime_minutes_per_line: 120
  overtime_step_minutes: 30
  # Operators that may move into or out of one line
  max_operators_moved_per_line: 5
  # Costs, in "pieces of output a change must save to be worth it"
  # Lines within 2% of target count as on track (normal day-to-day wobble)
  on_track_tolerance: 0.02
  move_cost_pieces: 2
  overtime_cost_pieces_per_worker_hour: 0.5
  solver_time_limit_seconds: 10
  # Typical end-of-day gap (actual minus target productivity) when a line
  # misses or meets its target. Medians from the training weeks (notebook 04b).
  # Used to estimate output when no live figure is available.
  typical_gap:
    sewing:
      missed: -0.14
      met: 0.0
    finishing:
      missed: -0.15
      met: 0.15

vision:
  # AITEX fabric images, downloaded into data/images/aitex/ (see docs/DATASETS.md)
  raw_dir: data/images/aitex
  # Prepared YOLO dataset (tiles + labels + data.yaml)
  prepared_dir: data/processed/fabric
  # One class: AITEX has 12 rare defect types (too few examples each), and DHU
  # only needs a defect count
  classes:
    - defect
  # AITEX images are 4096 x 256 strips, cut into square tiles
  tile_size: 256
  tile_stride: 256
  # Ignore mask specks smaller than this (pixels). Fuzzyballs, the most common
  # AITEX defect, are only 8-19 pixels, so this must stay small.
  min_defect_area: 4
  # Tiny boxes are enlarged to at least this size (pixels); YOLO struggles below it
  min_box_size: 8
  # Defect-free tiles kept per defect tile in training (they far outnumber defects)
  background_ratio: 1.0
  split: [0.7, 0.15, 0.15]
  # Pretrained YOLOv8 nano weights (about 6 MB, downloaded by Ultralytics on first use)
  yolo_weights: yolov8n.pt
  epochs: 50
  batch_size: 16
  patience: 15
  # Chosen on the validation panels (notebook 05): best DHU match with few false alarms
  confidence_threshold: 0.15
  model_file: defect_model.pt
  metrics_file: defect_metrics.json

simulation:
  # Each simulated day replays the setup of a real day from the test weeks
  # (never seen by the model), revealed hour by hour.
  n_lines: 12
  hours_per_shift: 8
  # Random variation in hourly output (6% = typical hour-to-hour wobble)
  hourly_noise: 0.06
  # Chance per line per hour of a machine breakdown or a style change
  breakdown_probability: 0.04
  style_change_probability: 0.02
  # Output drop for the rest of the day after a style change (learning curve)
  style_change_penalty: 0.10
  seconds_between_ticks: 2
  output_file: data/interim/live_stream.csv

assistant:
  model: claude-opus-5-5
  max_tokens: 16000
  # "low" suits short chat answers; raise to "medium" for deeper analysis
  effort: low
  # Questions remembered in the chat (older turns are dropped)
  history_turns: 6
